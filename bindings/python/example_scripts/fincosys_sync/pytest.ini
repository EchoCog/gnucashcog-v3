[pytest]
# Anchors pytest's rootdir at this directory (fincosys_sync/) rather than
# letting it walk up to the repository root. Without this, pytest's
# module-name resolution for bindings/python/example_scripts/fincosys_sync/
# tests/*.py computes a dotted path that passes through
# bindings/python/__init__.py -- which is the real GnuCash `gnucash` package
# init and unconditionally does `from gnucash.gnucash_core import *`. That
# raises ModuleNotFoundError whenever the compiled bindings aren't on
# PYTHONPATH, which breaks collection of these (deliberately
# bindings-independent) --plan-only tests. Anchoring rootdir here keeps
# collection scoped to fincosys_sync and avoids ever importing that file.
addopts = --import-mode=importlib
