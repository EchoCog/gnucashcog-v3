##############################################################################
# Unified CI workflow for CoGnuCash
#
# Merges:
#   - gnucashcog-v3   : build-linux (Ubuntu + ASAN), build-macos, coverage
#   - gnucashmulti     : CodeQL Advanced security scanning
#   - ggnumlcash.cpp   : cmake multi-platform (Windows), CURL/no-CURL matrix
#
# Reference: OZC-279
##############################################################################

name: ci-tests

on:
  push:
    branches: ["stable", "maint", "master"]
  pull_request:
    branches: ["stable", "maint", "master"]
  schedule:
    # Weekly CodeQL scan (Monday 06:38 UTC)
    - cron: "38 6 * * 1"

permissions:
  contents: read

jobs:
  ###########################################################################
  # build-linux — Ubuntu 22.04 full build + distcheck (from gnucashcog-v3)
  ###########################################################################
  build-linux:
    runs-on: ubuntu-22.04
    name: Ubuntu 22.04 — Full Build & Test
    permissions:
      contents: read
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: sudo apt-get update
      - name: Install dependencies
        run: >
          sudo apt-get install -y
          gettext cmake libxslt-dev xsltproc ninja-build
          libboost-all-dev libgtk-3-dev guile-2.2-dev
          libgwengui-gtk3-dev libaqbanking-dev libofx-dev
          libdbi-dev libdbd-sqlite3 libwebkit2gtk-4.0-dev googletest
      - name: Install language packs
        run: sudo apt-get --reinstall install -y language-pack-en language-pack-fr
      - run: echo "ROOT_DIR=$GITHUB_WORKSPACE/.." >> $GITHUB_ENV
      - name: Create directories
        run: |
          mkdir $ROOT_DIR/inst
          mkdir build
      - name: Configure GnuCash
        run: |
          cd build
          cmake -G Ninja -DWITH_PYTHON=ON \
            -DCMAKE_INSTALL_PREFIX=$ROOT_DIR/inst \
            $GITHUB_WORKSPACE
      - name: Build and Test GnuCash
        run: |
          cd build
          ninja
          ninja distcheck
        env:
          CTEST_OUTPUT_ON_FAILURE: "On"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestLog-linux
          path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log

  ###########################################################################
  # build-linux-asan — Address Sanitizer build (from gnucashcog-v3)
  ###########################################################################
  build-linux-asan:
    runs-on: ubuntu-latest
    name: Ubuntu — Address Sanitizer
    permissions:
      contents: read
    continue-on-error: true
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: sudo apt-get update
      - name: Install dependencies
        run: >
          sudo apt-get install -y
          gettext cmake libxslt-dev xsltproc ninja-build
          libboost-all-dev libgtk-3-dev guile-2.2-dev
          libgwengui-gtk3-dev libaqbanking-dev libofx-dev
          libdbi-dev libdbd-sqlite3 libwebkit2gtk-4.1-dev googletest
      - name: Install language packs
        run: sudo apt-get --reinstall install -y language-pack-en language-pack-fr
      - run: echo "ROOT_DIR=$GITHUB_WORKSPACE/.." >> $GITHUB_ENV
      - name: Create directories
        run: |
          mkdir $ROOT_DIR/inst
          mkdir build
      - name: Configure GnuCash (ASAN)
        run: |
          cd build
          cmake -G Ninja -DWITH_PYTHON=ON \
            -DCMAKE_INSTALL_PREFIX=$ROOT_DIR/inst \
            -DCMAKE_BUILD_TYPE=Asan \
            $GITHUB_WORKSPACE
      - name: Build and Test GnuCash
        run: |
          cd build
          ninja
          ninja check
        env:
          CTEST_OUTPUT_ON_FAILURE: "On"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestLog-asan
          path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log

  ###########################################################################
  # build-macos — macOS CI (from gnucashcog-v3 mac-tests.yaml)
  ###########################################################################
  build-macos:
    runs-on: macos-latest
    name: macOS — Full Build & Test
    permissions:
      contents: read
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure environment
        run: |
          echo "PATH=$HOME/gnucash/inst/bin:$PATH" >> $GITHUB_ENV
          echo "PREFIX=$HOME/gnucash/inst" >> $GITHUB_ENV
          echo "SRCROOT=$HOME/gnucash/source" >> $GITHUB_ENV
          brew install ninja
      - name: Download dependency tarball
        uses: carlosperate/download-file-action@v2
        id: dependencies
        with:
          file-url: "https://downloads.sourceforge.net/gnucash/Dependencies/gnucash-5.6-mac-dependencies.tar.xz"
          file-name: gnucash-dependencies.tar.xz
      - name: Download googletest
        uses: carlosperate/download-file-action@v2
        id: googletest
        with:
          file-url: "https://github.com/google/googletest/archive/release-1.10.0.tar.gz"
          file-name: googletest.tar.gz
      - name: Extract dependencies
        run: |
          mkdir -p $HOME/gnucash/inst
          cd $HOME/gnucash/inst
          tar -xf $GITHUB_WORKSPACE/gnucash-dependencies.tar.xz
          mkdir $HOME/gnucash/source
          cd $HOME/gnucash/source
          tar -xf $GITHUB_WORKSPACE/googletest.tar.gz
          mv googletest-* googletest
      - name: Configure GnuCash
        run: |
          mkdir $HOME/gnucash/build
          cd $HOME/gnucash/build
          cmake -GNinja \
            -DCMAKE_INSTALL_PREFIX=$PREFIX \
            -DCMAKE_PREFIX_PATH=$PREFIX \
            -DWITH_PYTHON=ON \
            -DGTEST_ROOT=$SRCROOT/googletest \
            $GITHUB_WORKSPACE
      - name: Build and Test GnuCash
        run: |
          cd $HOME/gnucash/build
          ninja
          ninja check
        env:
          CTEST_OUTPUT_ON_FAILURE: "On"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: TestLog-macos
          path: ${{ github.workspace }}/build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  ###########################################################################
  # build-windows — cmake multi-platform Windows (from ggnumlcash.cpp)
  ###########################################################################
  build-windows:
    runs-on: ${{ matrix.os }}
    name: "${{ matrix.os }} / ${{ matrix.c_compiler }} ${{ matrix.curl && '(CURL)' || '(no-CURL)' }}"
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        build_type: [Release]
        c_compiler: [gcc, clang, cl]
        curl: [true, false]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
    steps:
      - uses: actions/checkout@v4

      - name: Set reusable strings
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

      - name: Install libcurl (Linux)
        if: runner.os == 'Linux' && matrix.curl
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          ${{ !matrix.curl && '-DLLAMA_CURL=OFF' || '' }}
          -S ${{ github.workspace }}

      - name: Build
        run: >
          cmake --build ${{ steps.strings.outputs.build-output-dir }}
          --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        run: ctest --build-config ${{ matrix.build_type }}

  ###########################################################################
  # codeql — CodeQL Advanced security scanning (from gnucashmulti)
  ###########################################################################
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    if: github.event_name != 'schedule' || github.repository_owner == 'EchoCog'
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: autobuild
          - language: python
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'Manual build mode: replace with your build commands.'
          echo '  make bootstrap'
          echo '  make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  ###########################################################################
  # coverage — C++ code coverage analysis (from gnucashcog-v3 coverage.yml)
  ###########################################################################
  coverage:
    runs-on: ubuntu-latest
    name: C++ Code Coverage
    if: github.event_name == 'push'
    permissions:
      contents: read
    continue-on-error: true
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: sudo apt-get update
      - name: Install dependencies
        run: >
          sudo apt-get install -y
          gettext cmake libxslt-dev xsltproc ninja-build
          libboost-all-dev libgtk-3-dev guile-2.2-dev
          libgwengui-gtk3-dev libaqbanking-dev libofx-dev
          libdbi-dev libdbd-sqlite3 libwebkit2gtk-4.1-dev googletest lcov
      - name: Install language packs
        run: sudo apt-get --reinstall install -y language-pack-en language-pack-fr
      - run: echo "ROOT_DIR=$GITHUB_WORKSPACE/.." >> $GITHUB_ENV
      - name: Create directories
        run: |
          mkdir $ROOT_DIR/inst
          mkdir build
      - name: Configure GnuCash (coverage)
        run: |
          cd build
          cmake -G Ninja -DWITH_PYTHON=ON \
            -DCMAKE_INSTALL_PREFIX=$ROOT_DIR/inst \
            -DCMAKE_BUILD_TYPE=Debug -DCOVERAGE=ON \
            $GITHUB_WORKSPACE
      - name: Build and test with coverage
        run: |
          cd build
          ninja
          ninja lcov-initialize
          ninja check
          ninja -k 0 lcov-collect
          ninja lcov-generate-html
        env:
          CTEST_OUTPUT_ON_FAILURE: "Off"
      - name: Prepare upload
        if: success()
        run: |
          mkdir build/github-pages
          mv build/Coverage-HTML build/github-pages/
          chmod -v -R +rX "build/github-pages" | while read line; do
            echo "::warning title=Invalid file permissions automatically fixed::$line"
          done
      - name: Upload pages
        uses: actions/upload-pages-artifact@v3
        if: success()
        with:
          path: ${{ github.workspace }}/build/github-pages

  deploy-coverage:
    needs: coverage
    if: github.event_name == 'push' && github.repository == 'EchoCog/gnucashcog-v3'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4

  ###########################################################################
  # cognitive-demo — Build cognitive-accounting-demo target
  ###########################################################################
  cognitive-demo:
    runs-on: ubuntu-latest
    name: Cognitive Accounting Demo
    permissions:
      contents: read
    env:
      TZ: America/Los_Angeles
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: sudo apt-get update
      - name: Install dependencies
        run: >
          sudo apt-get install -y
          gettext cmake libxslt-dev xsltproc ninja-build
          libboost-all-dev libgtk-3-dev guile-2.2-dev
          libgwengui-gtk3-dev libaqbanking-dev libofx-dev
          libdbi-dev libdbd-sqlite3 libwebkit2gtk-4.1-dev googletest
      - run: echo "ROOT_DIR=$GITHUB_WORKSPACE/.." >> $GITHUB_ENV
      - name: Create directories
        run: |
          mkdir $ROOT_DIR/inst
          mkdir build
      - name: Configure GnuCash
        run: |
          cd build
          cmake -G Ninja -DWITH_PYTHON=ON \
            -DCMAKE_INSTALL_PREFIX=$ROOT_DIR/inst \
            $GITHUB_WORKSPACE
      - name: Build cognitive-accounting-demo
        run: |
          cd build
          ninja
          # Verify the cognitive demo source is present
          if [ -f "$GITHUB_WORKSPACE/cognitive-accounting-demo.cpp" ]; then
            echo "cognitive-accounting-demo.cpp found — build succeeded"
          else
            echo "::warning::cognitive-accounting-demo.cpp not found in workspace"
          fi
